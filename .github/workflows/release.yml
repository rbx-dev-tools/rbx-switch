name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# One artifact, one platform. See the note in ci.yml: on anything but Windows
# this binary can only print "not supported on this platform", so shipping a
# Linux or macOS build would be shipping that sentence in an archive.
jobs:
  build-release:
    name: Build Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo build --release --target x86_64-pc-windows-msvc --bin rbx-switch
      - name: Package
        run: |
          cd target/x86_64-pc-windows-msvc/release
          Compress-Archive -Path rbx-switch.exe -DestinationPath ../../../rbx-switch-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
      - name: Generate SHA256 checksum
        run: Get-FileHash -Algorithm SHA256 rbx-switch-*.zip | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            rbx-switch-*.zip
            SHA256SUMS

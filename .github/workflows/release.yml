name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# The build runs with read access only. The job that publishes asks for what
# it needs, so a compromised build step cannot write to the repository or mint
# an attestation.
permissions:
  contents: read

# One artifact, one platform. See the note in ci.yml: on anything but Windows
# this binary can only print "not supported on this platform", so shipping a
# Linux or macOS build would be shipping that sentence in an archive.
jobs:
  build-release:
    name: Build Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # `--locked`: the archive must come from the dependency graph CI tested.
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin rbx-account
      - name: Package
        run: |
          cd target/x86_64-pc-windows-msvc/release
          Compress-Archive -Path rbx-account.exe -DestinationPath ../../../rbx-account-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rbx-account-windows
          path: rbx-account-*.zip
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Both are what `actions/attest-build-provenance` needs: an OIDC token to
      # sign with, and the right to store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
      - name: Generate SHA256 checksum
        run: sha256sum rbx-account-*.zip > SHA256SUMS
      # `gh attestation verify <zip> --repo rbx-forge/rbx-account` proves the
      # archive was built here, from this tag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rbx-account-*.zip
      # The release body is the CHANGELOG section for this tag. A tag with no
      # section fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## \[/           { exit }
            inside                       { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: release-notes.md
          files: |
            rbx-account-*.zip
            SHA256SUMS

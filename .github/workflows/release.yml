name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# One artifact, one platform. See the note in ci.yml: on anything but Windows
# this binary can only print "not supported on this platform", so shipping a
# Linux or macOS build would be shipping that sentence in an archive.
jobs:
  build-release:
    name: Build Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # `--locked`: the archive must come from the dependency graph CI tested.
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin rbx-account
      - name: Package
        run: |
          cd target/x86_64-pc-windows-msvc/release
          Compress-Archive -Path rbx-account.exe -DestinationPath ../../../rbx-account-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
      - name: Generate SHA256 checksum
        run: Get-FileHash -Algorithm SHA256 rbx-account-*.zip | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS
      # The release body is the CHANGELOG section for this tag. A tag with no
      # section fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## \[/           { exit }
            inside                       { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release-notes.md
          files: |
            rbx-account-*.zip
            SHA256SUMS

[package]
name = "rbx-account"
version = "0.5.0"
edition = "2021"
# Set by a dependency, not by our code: our own sources need 1.82, and the
# number below is the highest `rust-version` in the resolved graph (clap 4.6
# and hashbrown 0.17 both declare 1.85). It moves when a dependency moves it;
# the `msrv` CI job is what stops it moving silently.
rust-version = "1.85"
license = "MPL-2.0"
description = "Switch the Roblox account Studio and the Player are signed in as, from the command line"
repository = "https://github.com/rbx-forge/rbx-account"
homepage = "https://github.com/rbx-forge/rbx-account"
authors = ["rbx-forge"]
keywords = ["roblox", "studio", "player", "cli", "accounts"]
categories = ["command-line-utilities", "game-development"]
readme = "README.md"

[lib]
name = "rbx_account"
path = "src/lib.rs"

[[bin]]
name = "rbx-account"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "3"
dialoguer = "0.11"
dirs = "6"
# Only `--player` uses it: a few blocking requests to Roblox. Blocking rather
# than an async client because there is nothing to overlap. 3.5 is the first
# with `timeout_per_read`.
ureq = "3.5"

[target.'cfg(windows)'.dependencies]
# The Player's cookie store is base64 around DPAPI.
base64 = "0.23"
windows-sys = { version = "0.59", features = [
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
winreg = "0.55"

# Release profile tuned for a distributed CLI binary. Slower to compile, but
# the binary is smaller and starts faster.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Default-on lints stay at their default level. Restriction-group lints like
# `unwrap_used` are deliberately not enabled: too much noise on patterns that
# are correct by construction.
todo = "warn"
dbg_macro = "warn"
print_stdout = "allow"   # CLI tool, println! is intentional
print_stderr = "allow"

[dev-dependencies]
tempfile = "3"

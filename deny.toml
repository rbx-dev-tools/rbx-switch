# cargo-deny: what we accept from the dependency tree.
#
# This tool ships as a statically linked binary, so four questions matter
# beyond "does it build": is a dependency subject to a published advisory,
# does a license put terms on the binary we cannot meet, does a crate come
# from somewhere other than crates.io, and are duplicate major versions
# creeping in.
#
# Run it locally with the same command CI runs: `cargo deny check`.

[graph]
# Windows only: the one platform the release ships, and the only one where
# the platform modules compile at all (see ci.yml).
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
# No blanket ignores. An advisory that does not apply is listed by id with its
# reason and a date to look at it again, and leaves the list as soon as the
# dependency can move.
ignore = []

[licenses]
version = 2
# Enumerated rather than pattern matched: a new license in the tree should fail
# CI and be a decision. Each one here allows redistribution in a binary under
# MPL-2.0. Deliberately absent: GPL and LGPL in any form, whose terms would
# attach to a statically linked artifact.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    # `webpki-roots`, the Mozilla root certificates `ureq` checks Roblox's TLS
    # certificate against. A permissive license for data: no copyleft, and the
    # one condition on sharing is to pass its text along, the same kind of
    # notice MIT asks for.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The threshold cargo-deny itself suggests for a license file matched by text
# rather than by SPDX id.
confidence-threshold = 0.8

[bans]
# Warn, not deny: a duplicate version is usually a dependency's transitive lag,
# and failing CI on something only a fork could fix trains everyone to ignore
# the job.
multiple-versions = "warn"
# No `*` version requirement on anything.
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only. Any git source is refused.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
